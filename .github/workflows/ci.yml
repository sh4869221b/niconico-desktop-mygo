name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH). Leave blank for CI only.'
        type: string
        required: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOARCH: amd64
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -mod=readonly ./... github.com/egoist/mygo/internal/windows github.com/egoist/mygo/internal/gpu/d3d11
      - name: Compare native player D3D11 pixels
        if: always() && !cancelled() && github.ref == 'refs/heads/codex/danmaku-gpu-astra-max'
        shell: pwsh
        run: ./testdata/danmaku_gpu/compare.ps1
      - name: Recheck original joining experiment
        if: always() && !cancelled() && github.ref == 'refs/heads/codex/danmaku-gpu-astra-max'
        continue-on-error: true
        shell: pwsh
        run: ./testdata/danmaku_gpu/compare.ps1 -Revision 47d71eb7fa93d306747f01db2a31d915fde02c09
      - name: Recheck original trimming experiment
        if: always() && !cancelled() && github.ref == 'refs/heads/codex/danmaku-gpu-astra-max'
        continue-on-error: true
        shell: pwsh
        run: ./testdata/danmaku_gpu/compare.ps1 -Revision b70602f0005b24d4a179fba696170a7a7bb1d8cb
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Build and package
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          $link = '-H=windowsgui'
          if ($tag) {
            if ($tag -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Expected vMAJOR.MINOR.PATCH.' }
            $link += " -X=main.version=$tag"
          }
          go build -mod=readonly -trimpath "-ldflags=$link" -o NiconicoDesktopMyGo.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path NiconicoDesktopMyGo.exe,README.md,third_party -DestinationPath NiconicoDesktopMyGo-win-x64.zip
          $hash = (Get-FileHash NiconicoDesktopMyGo-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NiconicoDesktopMyGo-win-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: NiconicoDesktopMyGo-win-x64
          path: |
            NiconicoDesktopMyGo-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != '')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: NiconicoDesktopMyGo-win-x64
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          args=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            args=(--verify-tag)
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check -
          gh release create "$tag" NiconicoDesktopMyGo-win-x64.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes "${args[@]}"
